name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
      dffs_mode:
        description: Crystal Chip dffs:/ test mode
        type: choice
        default: "Full recovered stack - ccmodman, ccdriver, dffs"
        options:
          - "Full recovered stack - ccmodman, ccdriver, dffs"
          - "Skip ccdriver - ccmodman, dffs"
          - "DataFlashFS only - reset IOP, load dffs"
          - "DataFlashFS only - preserve IOP, load dffs"
          - "Probe only - preserve IOP, load nothing"
          - "DFFS disabled"
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    # Track the current PS2 homebrew toolchain so CI catches PS2SDK compatibility changes.
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev libgmp10 libmpfr6 libmpc3
        else
          echo "No supported package manager found for dependency install." >&2
          exit 1
        fi

    - name: Verify toolchain runtime libs
      run: |
        cc1_path="$(mips64r5900el-ps2-elf-gcc -print-prog-name=cc1)"
        if [ -x "$cc1_path" ]; then
          ldd "$cc1_path"
        fi
        mips64r5900el-ps2-elf-gcc --version

    - uses: actions/checkout@v6
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow
    - name: Prepare PS2SDK source for local module builds
      run: |
        if [ -n "${PS2SDKSRC:-}" ] && [ -f "$PS2SDKSRC/Defs.make" ] && [ -f "$PS2SDKSRC/iop/Rules.make" ]; then
          echo "Using PS2SDKSRC=$PS2SDKSRC"
          exit 0
        fi
        if [ -n "${PS2SDK:-}" ] && [ -f "$PS2SDK/Defs.make" ] && [ -f "$PS2SDK/iop/Rules.make" ]; then
          echo "Using PS2SDK source tree at $PS2SDK"
          echo "PS2SDKSRC=$PS2SDK" >> "$GITHUB_ENV"
          exit 0
        fi
        ps2sdk_src_dir="${RUNNER_TEMP:-/tmp}/ps2sdk-src"
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git "$ps2sdk_src_dir"
        echo "PS2SDKSRC=$ps2sdk_src_dir" >> "$GITHUB_ENV"
    - name: Ensure scripts are executable
      run: |
        chmod +x scripts/ci/resolve_make_args.sh

    - name: Compile wLaunchELF
      run: |
        FLAGS="$(scripts/ci/resolve_make_args.sh \
          "${{ matrix.psx_profile }}" \
          "${{ matrix.pad_profile }}" \
          "${{ matrix.storage_profile }}" \
          0 0)"
        case "${{ github.event.inputs.dffs_mode || 'Full recovered stack - ccmodman, ccdriver, dffs' }}" in
          "Full recovered stack - ccmodman, ccdriver, dffs")
            DFFS_FLAGS="DFFS=1 DFFS_LOAD_RECOVERED=1 DFFS_LOAD_CCMODMAN=1 DFFS_LOAD_CCDRIVER=1 IOP_RESET=1"
            ;;
          "Skip ccdriver - ccmodman, dffs")
            DFFS_FLAGS="DFFS=1 DFFS_LOAD_RECOVERED=1 DFFS_LOAD_CCMODMAN=1 DFFS_LOAD_CCDRIVER=0 IOP_RESET=1"
            ;;
          "DataFlashFS only - reset IOP, load dffs")
            DFFS_FLAGS="DFFS=1 DFFS_LOAD_RECOVERED=1 DFFS_LOAD_CCMODMAN=0 DFFS_LOAD_CCDRIVER=0 IOP_RESET=1"
            ;;
          "DataFlashFS only - preserve IOP, load dffs")
            DFFS_FLAGS="DFFS=1 DFFS_LOAD_RECOVERED=1 DFFS_LOAD_CCMODMAN=0 DFFS_LOAD_CCDRIVER=0 IOP_RESET=0"
            ;;
          "Probe only - preserve IOP, load nothing")
            DFFS_FLAGS="DFFS=1 DFFS_LOAD_RECOVERED=0 DFFS_LOAD_CCMODMAN=0 DFFS_LOAD_CCDRIVER=0 IOP_RESET=0"
            ;;
          "DFFS disabled")
            DFFS_FLAGS="DFFS=0 DFFS_LOAD_RECOVERED=0 DFFS_LOAD_CCMODMAN=0 DFFS_LOAD_CCDRIVER=0 IOP_RESET=1"
            ;;
          *)
            echo "Unknown dffs_mode: ${{ github.event.inputs.dffs_mode }}" >&2
            exit 1
            ;;
        esac
        echo "Resolved make flags: $FLAGS"
        echo "DFFS make flags: $DFFS_FLAGS"
        make rebuild $FLAGS $DFFS_FLAGS ${{ github.event.inputs.make_args }}

    - name: Verify loader low-memory layout guard
      run: |
        make -C loader check-layout DEBUG=0

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          echo "No BOOT*.ELF produced by build." >&2
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
            WLE-${{ matrix.variant_name }}.ELF

####################################################### 
  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:

    - uses: actions/checkout@v6
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: WLE/
        pattern: "WLE-R3Z*"

    - name: list
      run: |
        ls -R

    - name: Publish latest automated build release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="latest"
        title="Latest automated build"

        if gh release view "$tag" >/dev/null 2>&1; then
          gh release edit "$tag" --title "$title"
        else
          gh release create "$tag" --title "$title" --notes "Automated build for ${GITHUB_SHA}" --target "${GITHUB_SHA}"
        fi

        mapfile -d '' assets < <(find WLE -type f -name '*.ELF' -print0)
        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No ELF assets found under WLE/." >&2
          exit 1
        fi
        gh release upload "$tag" "${assets[@]}" --clobber

    - name: Publish language files release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="language-files"
        title="Translations"

        if gh release view "$tag" >/dev/null 2>&1; then
          gh release edit "$tag" --title "$title"
        else
          gh release create "$tag" --title "$title" --notes "Automated language files for ${GITHUB_SHA}" --target "${GITHUB_SHA}"
        fi

        mapfile -d '' assets < <(find Lang -type f -name '*.LNG' -print0)
        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No language assets found under Lang/." >&2
          exit 1
        fi
        gh release upload "$tag" "${assets[@]}" --clobber

  trigger-auto-update:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [release]
    strategy:
      matrix:
        include:
          - repo: israpps/FreeMcBoot-Installer
            enabled: false
          - repo: israpps/Funtuna-Fork
            enabled: false
          - repo: israpps/PlayStation2-Basic-BootLoader
            enabled: false
    steps:
    - name: trigger israpps auto-update system
      if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && matrix.enabled }}
      uses: peter-evans/repository-dispatch@v1
      with:
          token: ${{ secrets.IUS }}
          repository: ${{ matrix.repo }} 
          event-type: Component_update
          client-payload: '{"sha": "${{ github.sha }}"}'
    - name: auto-update disabled for target
      if: ${{ !matrix.enabled }}
      run: echo "Auto-update dispatch disabled for ${{ matrix.repo }}."
